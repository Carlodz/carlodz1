<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="camera.css">
<link rel="stylesheet" href="clock.css">
<link rel="stylesheet" href="health.css">
<link rel="stylesheet" href="yasir.css">
<link rel="stylesheet" href="browser.css">
<link rel="stylesheet" href="cstore.css">
<link rel="stylesheet" href="splash.css">
<link rel="stylesheet" href="discord.css">
<style>html,body{margin:0;height:100%;overflow:hidden;background:transparent}body{display:block}#phone{position:absolute!important;left:0!important;right:0!important;top:0!important;bottom:0!important;margin:auto!important}</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gemgrad" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4285f4"/><stop offset=".55" stop-color="#9b72cb"/><stop offset="1" stop-color="#d96570"/></linearGradient></defs></svg>
<div id="phone" class="hidden sam">
  <div id="screen">
    <div id="notch" title="Camera"></div>
    <div id="status">
      <span class="st-left">
        <span id="clock">12:45</span>
        <svg class="st-ico st-nfc" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 9h6v6H9z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </span>
      <span id="sicons">
        <svg id="bt" class="st-ico hide" viewBox="0 0 24 24" width="13" height="13"><path d="M7 7l10 10-5 5V2l5 5L7 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg id="wf" class="st-ico st-wifi" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path d="M12 18.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z" fill="currentColor"/>
          <path d="M8.5 14.2a5 5 0 0 1 7 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M5.5 11.2a9 9 0 0 1 13 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M2.8 8.2a13 13 0 0 1 18.4 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <svg id="air" class="st-ico hide" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M21 15.5v-2L13.5 9V4.5a1.5 1.5 0 0 0-3 0V9L3 13.5v2l7.5-2.2V18L8.5 19.5V21l3.5-1 3.5 1v-1.5L13.5 18v-4.7z" fill="currentColor"/></svg>
        <svg id="sg" class="st-ico st-signal" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <rect x="3" y="14" width="3.2" height="6" rx="1" fill="currentColor"/>
          <rect x="8.2" y="10.5" width="3.2" height="9.5" rx="1" fill="currentColor"/>
          <rect x="13.4" y="7" width="3.2" height="13" rx="1" fill="currentColor"/>
          <rect x="18.6" y="3.5" width="3.2" height="16.5" rx="1" fill="currentColor"/>
        </svg>
        <span class="batt-pill" id="batt"><span class="batt-fill" id="battfill"></span><span class="batt-pct" id="battpct">100</span></span>
      </span>
    </div>

    <!-- Lock screen -->
    <div id="lock">
      <svg class="lk-ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10.5" rx="2.4" fill="currentColor"/><path d="M8.2 10.5V8a3.8 3.8 0 0 1 7.6 0v2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <div class="lk-clock" id="lkclock"></div>
      <div class="lk-dateRow"><span class="lk-date" id="lkdate">Tue, 5 May</span><span class="lk-wx"><i id="lkwxi"></i><b id="lkwxt"></b></span></div>
      <div class="lk-quick">
        <button type="button" id="lk-phone" class="lk-q" aria-label="Phone"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8z" fill="currentColor"/></svg></button>
        <button type="button" id="lk-cam" class="lk-q" aria-label="Camera"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h3l2-2h6l2 2h3v12H4V7z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
      </div>
    </div>

    <!-- Home (CPhone One UI style) -->
    <div id="home" class="hidden">
      <div id="home-clock"><b id="hclock">12:45</b><span id="hdate">Sat 3 October</span></div>
      <div id="hw-card" class="hw-glass">
        <span class="hw-cake"><svg viewBox="0 0 40 40" width="30" height="30"><defs><linearGradient id="hwb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fd0ff"/><stop offset="1" stop-color="#3b8cff"/></linearGradient></defs><circle cx="20" cy="20" r="19" fill="#eaf4ff"/><path d="M8 24a12 12 0 0 1 24 0z" fill="url(#hwb)"/><path d="M9 29h22M12 33h16" stroke="#9cc7ff" stroke-width="2.4" stroke-linecap="round"/></svg></span>
        <b id="hw-title">Good morning</b><span id="hw-sub">Get a personalized briefing that changes throughout the day.</span><button type="button" id="hw-brief">Start Now brief</button>
      </div>
      <div id="hw-row">
        <div id="wx-widget">
          <span class="wx-ico" id="wxico">☀️</span>
          <div class="wx-mid"><span class="wx-temp" id="wxtemp">--°</span><span class="wx-loc"><i id="wxloc">Los Santos</i></span></div>
          <span class="wx-cond" id="wxcond"></span><span class="wx-hl" id="wxhl"></span>
        </div>
        <div id="hw-start" class="hw-glass"><span id="hw-start-t">Start</span>
          <svg viewBox="0 0 60 60" width="46" height="46" aria-hidden="true"><defs><linearGradient id="hwg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2ee59d"/><stop offset=".5" stop-color="#3d8bff"/><stop offset="1" stop-color="#ff5fa8"/></linearGradient></defs><path d="M30 52S8 38 8 22a12 12 0 0 1 22-6 12 12 0 0 1 22 6c0 16-22 30-22 30z" fill="none" stroke="url(#hwg)" stroke-width="9" stroke-linejoin="round"/></svg>
        </div>
        <div id="hw-photo" hidden></div>
      </div>
      <div id="hw-care" hidden><div class="gg" id="gg-b" style="--p:100"><b>100</b></div></div>
      <div id="home-icons"></div>
      <div id="sam-search"><span class="g"></span><span class="ph">Search</span>
        <svg class="mic" viewBox="0 0 24 24" width="18" height="18"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z" fill="currentColor"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <svg class="lens" viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </div>
      <div id="page-dots" hidden><i class="on"></i></div>
      <div id="finder"><i>‹</i><span><svg viewBox="0 0 24 24" width="11" height="11"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Finder</span><i>+</i></div>
      <div id="dock"></div>
      <div id="swipe-up-hint"></div>
    </div>

    <!-- App drawer (swipe up) -->
    <!-- CPhone Quick Settings -->
    <div id="qspanel" class="hidden">
      <div class="qs-top">
        <span class="qs-carrier" id="qs-carrier">Los Santos</span>
        <span class="qs-actions">
          <button type="button" id="qs-edit" class="qs-act" aria-label="Edit">✎</button>
          <button type="button" id="qs-power" class="qs-act" aria-label="Power">⏻</button>
          <button type="button" id="qs-set" class="qs-act" aria-label="Settings">⚙</button>
        </span>
      </div>
      <div class="qs-tiles">
        <button type="button" class="qs-wide" id="qs-wifi" data-t="wifi">
          <span class="qs-ico"></span>
          <span class="qs-meta"><b>Wi-Fi</b><small id="qs-wifiname">Los Santos Net</small></span>
        </button>
        <button type="button" class="qs-wide" id="qs-bt" data-t="bt">
          <span class="qs-ico"></span>
          <span class="qs-meta"><b>Bluetooth</b><small id="qs-btname">Off</small></span>
        </button>
      </div>
      <div class="qs-grid" id="qs-grid"></div>
      <div class="qs-sliders">
        <div class="qs-row">
          <div class="qs-slider-wrap">
            <span class="qs-sl-ico" id="qs-brt-ico"></span>
            <input type="range" id="qs-brt" min="20" max="100" value="100">
          </div>
          <button type="button" class="qs-round" id="qs-night" data-t="night"></button>
        </div>
        <div class="qs-row">
          <div class="qs-slider-wrap">
            <span class="qs-sl-ico" id="qs-vol-ico"></span>
            <input type="range" id="qs-vol" min="0" max="100" value="70">
          </div>
          <button type="button" class="qs-round" id="qs-mute" data-t="mute"></button>
        </div>
      </div>
      <div id="qs-mcard"></div>
      <div class="qs-bottom">
        <button type="button" id="qs-modes"><span class="qs-ico"></span><span class="qs-bt"><b>Modes</b></span></button>
        <button type="button" id="qs-smart"><span class="qs-ico"></span><span class="qs-bt"><b>SmartThings</b><small>Device control</small></span></button>
      </div>
      <div class="qs-handle"></div>
    </div>

    <!-- CPhone notification shade (live notifications + media card) -->
    <div id="ntpanel" class="hidden">
      <div class="nt-top"><span id="nt-carrier">Los Santos</span></div>
      <div class="nt-clock"><b id="nt-time">12:45</b><span id="nt-date">Sat 3 Oct</span></div>
      <div class="nt-sec" id="nt-sec-live">Live notifications</div>
      <div id="nt-media"></div>
      <div class="nt-sec hidden" id="nt-sec-n">Notifications<button type="button" id="nt-clear">Clear</button></div>
      <div class="nt-list" id="nt-list"></div>
      <div class="nt-fill"></div>
      <button type="button" id="nt-settings" class="nt-set">Notification settings</button>
    </div>

    <!-- CPhone Recents (task switcher) -->
    <div id="recents" class="hidden">
      <div class="rc-cards" id="rc-cards"></div>
      <button type="button" id="rc-closeall" class="rc-closeall">Close all</button>
      <div class="rc-icons" id="rc-icons"></div>
    </div>

    <div id="drawer" class="hidden">
      <div class="dr-handle"></div>
      <div class="dr-search"><svg viewBox="0 0 24 24" width="18" height="18" style="flex:none;opacity:.7"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="drq" placeholder="Search" autocomplete="off"></div>
      <div id="dr-grid"></div>
    </div>

    <div id="app" class="hidden"></div>
    <div id="call" class="hidden"></div>
    <div id="toast"></div>
    <div id="dim"></div>
    <div id="bar" class="sam-nav">
      <button type="button" id="nav-recents" aria-label="Recents"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="5" y="5" width="14" height="14" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.9"/></svg></button>
      <button type="button" id="nav-home" aria-label="Home"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.9"/></svg></button>
      <button type="button" id="nav-back" aria-label="Back"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M14 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
</div>
<script src="preview-mock.js"></script>
<script src="app.js"></script>
<script src="camera.js"></script>
<script src="clock.js"></script>
<script src="health.js"></script>
<script src="yasir.js"></script>
<script src="browser.js"></script>
<script src="cstore.js"></script>
<script src="splash.js"></script>
<script src="discord.js"></script>
</body>
</html>
